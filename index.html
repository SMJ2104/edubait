<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>EduBait - SamJ</title>
    <style>
        body {
            font-family: "Space Mono", Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: black;
            text-align: center;
            color: black;
        }
        h1 {
            color: green;
        }
        .answer-box {
            background: #295411;
            padding: 15px;
            margin: 10px auto;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            text-align: left;
        }
        .question {
            color: #90EE90;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .answer {
            color: white;
        }
        .warning {
            background-color: #ffcc00;
            color: black;
            font-weight: bold;
            padding: 10px;
            margin: 10px auto;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .search-container {
            background-color: #1a1a1a;
            padding: 15px;
            margin: 10px auto;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .search-box {
            width: 100%;
            padding: 10px;
            font-family: "Space Mono", Arial, sans-serif;
            font-size: 16px;
            border: 2px solid green;
            border-radius: 4px;
            background-color: black;
            color: green;
            box-sizing: border-box;
        }
        .search-box:focus {
            outline: none;
            border-color: #90EE90;
        }
        .highlight {
            background-color: yellow;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>EduBait</h1>
    <div class="search-container">
        <input type="text" class="search-box" id="searchBox" placeholder="Search questions...">
    </div>
    <div id="warning"></div>
    <div id="answers"></div>
    <script>
        // Function to get query parameters
        function getQueryParam(name) {
            let params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        // Function to capitalize just the first letter of the first word
        function capitalizeFirstWord(str) {
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }
        // Decode Base64 JSON answers
        let encodedAnswers = getQueryParam("answers");
        if (encodedAnswers) {
            try {
                let decodedJson = atob(encodedAnswers);
                let answersObject = JSON.parse(decodedJson);
                let answersDiv = document.getElementById("answers");
                let warningDiv = document.getElementById("warning");
                
                // Convert object to array of entries
                let answersArray = Object.entries(answersObject);
                
                // If fewer than 40 answers, show a warning
                if (answersArray.length < 40) {
                    warningDiv.innerHTML = `
                        <div class="warning">
                            ⚠️ Answers may be out of order — For now, search for the questions above
                        </div>
                    `;
                }
                // Loop through answers and display them
                answersArray.forEach(([question, answer], index) => {
                    let answerBox = document.createElement("div");
                    answerBox.classList.add("answer-box");
                    
                    let questionDiv = document.createElement("div");
                    questionDiv.classList.add("question");
                    questionDiv.textContent = `Q${index + 1}: ${question}`;
                    
                    let answerDiv = document.createElement("div");
                    answerDiv.classList.add("answer");
                    answerDiv.textContent = `A: ${capitalizeFirstWord(answer)}`;
                    
                    answerBox.appendChild(questionDiv);
                    answerBox.appendChild(answerDiv);
                    answersDiv.appendChild(answerBox);
                });
                
                // Search functionality
                let searchBox = document.getElementById("searchBox");
                searchBox.addEventListener("input", function() {
                    let searchTerm = this.value.trim().toLowerCase();
                    let allBoxes = document.querySelectorAll(".answer-box");
                    
                    // Remove all existing highlights
                    allBoxes.forEach(box => {
                        let question = box.querySelector(".question");
                        let answer = box.querySelector(".answer");
                        question.innerHTML = question.textContent;
                        answer.innerHTML = answer.textContent;
                    });
                    
                    if (searchTerm === "") return;
                    
                    let firstMatch = null;
                    
                    // Search and highlight matches
                    allBoxes.forEach(box => {
                        let question = box.querySelector(".question");
                        let answer = box.querySelector(".answer");
                        let questionText = question.textContent;
                        let answerText = answer.textContent;
                        
                        let questionLower = questionText.toLowerCase();
                        let answerLower = answerText.toLowerCase();
                        
                        // Check if search term is in question or answer
                        if (questionLower.includes(searchTerm) || answerLower.includes(searchTerm)) {
                            if (!firstMatch) {
                                firstMatch = box;
                            }
                            
                            // Highlight in question
                            if (questionLower.includes(searchTerm)) {
                                let regex = new RegExp(`(${searchTerm})`, 'gi');
                                question.innerHTML = questionText.replace(regex, '<span class="highlight">$1</span>');
                            }
                            
                            // Highlight in answer
                            if (answerLower.includes(searchTerm)) {
                                let regex = new RegExp(`(${searchTerm})`, 'gi');
                                answer.innerHTML = answerText.replace(regex, '<span class="highlight">$1</span>');
                            }
                        }
                    });
                    
                    // Scroll to first match
                    if (firstMatch) {
                        firstMatch.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                });
            } catch (error) {
                console.error("Error decoding answers:", error);
                document.getElementById("answers").innerHTML = "<p>Error loading answers.</p>";
            }
        } else {
            document.getElementById("answers").innerHTML = "<p>No answers found.</p>";
            window.location.replace("/install.html");
        }
    </script>
</body>
</html>
